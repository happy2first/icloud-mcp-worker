name = "icloud-mcp-worker"
main = "dist/worker.js"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false
keep_vars = true
[observability]
enabled = true
redact_query_string = true
[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true
[observability.issues]
enabled = true
[build]
command = "npm run build"
# Dashboard runtime variables: TEAM_DOMAIN, POLICY_AUD.
# Runtime Secret: ENCRYPTION_KEYS_JSON. Apple login/renewal default on;
# local session retention is unlimited. Origin and owner derive from verified requests.
[[d1_databases]]
binding = "DB"
database_name = "icloud-mcp-worker"
# Wrangler >=4.45 reuses the named database, or provisions it on first deploy.
# For an explicitly managed database, set its real database_id in your config.
# Never use a placeholder UUID: it disables provisioning and fails with 10181.
