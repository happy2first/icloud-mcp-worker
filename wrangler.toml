name = "icloud-mcp-worker"
main = "dist/worker.js"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false
[build]
command = "npm run build"
[vars]
APPLE_LOGIN_ENABLED = "true"
APPLE_SESSION_RENEWAL_ENABLED = "saved-tokens-v1"
APPLE_SESSION_RETENTION_WRITES = "absolute-30d-v1"
ENCRYPTION_KEY_ID = "v1"
# Configure APP_ORIGIN, TEAM_DOMAIN, POLICY_AUD, REMINDERS_OWNER_ID before deploy.
[[d1_databases]]
binding = "DB"
database_name = "icloud-mcp-worker"
# Wrangler >=4.45 reuses the named database, or provisions it on first deploy.
# For an explicitly managed database, set its real database_id in your config.
# Never use a placeholder UUID: it disables provisioning and fails with 10181.
